<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Events</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .add-event-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .add-event-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.95em;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .event-content {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }

        .event-date {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 20px;
        }

        /* Converging photo track */
        .convergence-track {
            position: relative;
            height: 90px;
            margin: 10px 0 30px 0;
            padding: 0 38px;
        }

        .track-line {
            position: absolute;
            top: 50%;
            left: 38px;
            right: 38px;
            height: 4px;
            background: #eef0f5;
            transform: translateY(-50%);
            border-radius: 2px;
        }

        .track-progress-line {
            position: absolute;
            top: 50%;
            left: 38px;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transform: translateY(-50%);
            border-radius: 2px;
            width: 0%;
        }

        .photo-bubble-wrap {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .photo-bubble-wrap.target {
            right: 0;
        }

        .photo-bubble-wrap.current {
            left: 0;
            transition: left 1s linear;
        }

        .bubble-label {
            font-size: 0.65em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .photo-bubble {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4em;
        }

        .photo-bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .countdown-item {
            text-align: center;
            background: #f5f5f5;
            padding: 15px 5px;
            border-radius: 8px;
        }

        .countdown-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .countdown-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .status {
            font-weight: 600;
            font-size: 0.9em;
        }

        .status.upcoming {
            color: #667eea;
        }

        .status.today {
            color: #ffa500;
        }

        .status.passed {
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Days until we meet</h1>
            <p>Track multiple events when I will see My Princess</p>
        </header>

        <div class="add-event-section">
            <h2>Add New Event</h2>
            <form id="eventForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="eventName">Event Name</label>
                        <input type="text" id="eventName" placeholder="e.g., Summer Vacation" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Target Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group full">
                        <label for="eventTime">Target Time (optional, defaults to midnight)</label>
                        <input type="time" id="eventTime">
                    </div>
                </div>
                <p style="grid-column:1/-1;font-size:0.85em;color:#888;margin-bottom:15px;">
                    The tracker photos are fixed: <code>Obraz1.jpeg</code> (Today) and <code>Obraz2.jpeg</code> (Target) — place those two files next to <code>index.html</code> in your repo.
                </p>
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Add Event</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>
            </form>
        </div>

        <div id="eventsContainer" class="events-grid">
            <div class="empty-state">
                <h2>No events yet!</h2>
                <p>Add your first event to get started 🚀</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize app
        const eventsContainer = document.getElementById('eventsContainer');
        const eventForm = document.getElementById('eventForm');
        const eventNameInput = document.getElementById('eventName');
        const eventDateInput = document.getElementById('eventDate');
        const eventTimeInput = document.getElementById('eventTime');

        // Fixed reference photos for the tracker — must live next to index.html in the repo
        const CURRENT_PHOTO_SRC = 'Obraz1.jpeg';
        const TARGET_PHOTO_SRC = 'Obraz2.jpeg';

        // Load events from localStorage
        let events = JSON.parse(localStorage.getItem('countdownEvents')) || [];

        // Keeps references to each card's live-updating elements so the
        // per-second tick only touches text/style, never rebuilds the DOM
        // (rebuilding every second was what caused the page to jump).
        let elementRefs = {};

        // Add event
        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newEvent = {
                id: Date.now(),
                name: eventNameInput.value,
                date: eventDateInput.value,
                time: eventTimeInput.value || '00:00',
                createdAt: new Date().toISOString()
            };

            events.push(newEvent);
            saveEvents();
            eventForm.reset();
            renderEvents();
        });

        // Delete event
        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveEvents();
            renderEvents();
        }
        window.deleteEvent = deleteEvent;

        // Save events to localStorage
        function saveEvents() {
            localStorage.setItem('countdownEvents', JSON.stringify(events));
        }

        function getTargetDate(event) {
            return new Date(`${event.date}T${event.time || '00:00'}`);
        }

        // Calculate countdown
        function calculateCountdown(event) {
            const target = getTargetDate(event).getTime();
            const now = new Date().getTime();
            const difference = target - now;

            if (difference <= 0) {
                return { days: 0, hours: 0, minutes: 0, seconds: 0, passed: true };
            }

            return {
                days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                minutes: Math.floor((difference / 1000 / 60) % 60),
                seconds: Math.floor((difference / 1000) % 60),
                passed: false
            };
        }

        // Progress from when the event was ADDED (createdAt) to the target
        function calculateProgress(event) {
            const target = getTargetDate(event).getTime();
            const created = new Date(event.createdAt).getTime();
            const now = new Date().getTime();

            const totalSpan = target - created;
            if (totalSpan <= 0) return 100;

            const elapsed = now - created;
            return Math.max(0, Math.min(100, (elapsed / totalSpan) * 100));
        }

        function getStatus(countdown) {
            if (countdown.passed) return 'passed';
            if (countdown.days === 0 && countdown.hours < 24) return 'today';
            return 'upcoming';
        }

        function photoBubbleContent(photoSrc, fallbackEmoji) {
            // onerror swaps in the emoji if Obraz1.jpeg/Obraz2.jpeg isn't found in the repo yet
            return `<img src="${photoSrc}" alt="" onerror="this.parentElement.textContent='${fallbackEmoji}'">`;
        }

        // Full render — only called when events are added/deleted/loaded
        function renderEvents() {
            elementRefs = {};

            if (events.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>No events yet!</h2>
                        <p>Add your first event to get started 🚀</p>
                    </div>
                `;
                return;
            }

            eventsContainer.innerHTML = events.map(event => {
                const targetDateObj = getTargetDate(event);

                return `
                    <div class="event-card">
                        <div class="event-content">
                            <h3 class="event-title">${event.name}</h3>
                            <p class="event-date">${targetDateObj.toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>

                            <div class="convergence-track">
                                <div class="track-line"></div>
                                <div class="track-progress-line" data-role="track-progress"></div>
                                <div class="photo-bubble-wrap current" data-role="current-wrap">
                                    <span class="bubble-label">Today</span>
                                    <div class="photo-bubble">${photoBubbleContent(CURRENT_PHOTO_SRC, '📍')}</div>
                                </div>
                                <div class="photo-bubble-wrap target">
                                    <span class="bubble-label">${event.name.length > 10 ? event.name.slice(0, 10) + '…' : event.name}</span>
                                    <div class="photo-bubble">${photoBubbleContent(TARGET_PHOTO_SRC, '🎯')}</div>
                                </div>
                            </div>

                            <div class="countdown">
                                <div class="countdown-item">
                                    <div class="countdown-value" data-role="days">0</div>
                                    <div class="countdown-label">Days</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value" data-role="hours">0</div>
                                    <div class="countdown-label">Hours</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value" data-role="minutes">0</div>
                                    <div class="countdown-label">Minutes</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value" data-role="seconds">0</div>
                                    <div class="countdown-label">Seconds</div>
                                </div>
                            </div>

                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Progress</span>
                                    <span data-role="progress-text">0%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" data-role="progress-fill"></div>
                                </div>
                            </div>

                            <div class="event-footer">
                                <span class="status" data-role="status">🎯 Upcoming</span>
                                <button class="btn-delete" onclick="deleteEvent(${event.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Grab live refs for each card in the same order as `events`
            const cards = eventsContainer.querySelectorAll('.event-card');
            events.forEach((event, i) => {
                const card = cards[i];
                elementRefs[event.id] = {
                    days: card.querySelector('[data-role="days"]'),
                    hours: card.querySelector('[data-role="hours"]'),
                    minutes: card.querySelector('[data-role="minutes"]'),
                    seconds: card.querySelector('[data-role="seconds"]'),
                    progressFill: card.querySelector('[data-role="progress-fill"]'),
                    progressText: card.querySelector('[data-role="progress-text"]'),
                    trackProgress: card.querySelector('[data-role="track-progress"]'),
                    currentWrap: card.querySelector('[data-role="current-wrap"]'),
                    status: card.querySelector('[data-role="status"]')
                };
            });

            tick(); // populate values immediately instead of waiting 1s
        }

        // Lightweight per-second update — no DOM rebuild, so no jump/flicker
        function tick() {
            events.forEach(event => {
                const refs = elementRefs[event.id];
                if (!refs) return;

                const countdown = calculateCountdown(event);
                const progress = calculateProgress(event);
                const status = getStatus(countdown);

                refs.days.textContent = countdown.days;
                refs.hours.textContent = countdown.hours;
                refs.minutes.textContent = countdown.minutes;
                refs.seconds.textContent = countdown.seconds;

                refs.progressFill.style.width = progress + '%';
                refs.trackProgress.style.width = progress + '%';
                refs.progressText.textContent = progress.toFixed(1) + '%';

                // Move the "current" bubble along the track toward the target bubble
                refs.currentWrap.style.left = `calc(${progress}% - ${(progress / 100) * 60}px)`;

                refs.status.className = 'status ' + status;
                refs.status.textContent = status === 'passed' ? '✓ Passed' : status === 'today' ? '⚡ Today!' : '🎯 Upcoming';
            });
        }

        // Update countdowns every second (lightweight — see tick())
        setInterval(tick, 1000);

        // Initial render
        renderEvents();
    </script>
</body>
</html>
