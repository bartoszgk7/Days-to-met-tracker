<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Events</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .add-event-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .add-event-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.95em;
        }

        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .photo-upload {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .photo-upload input[type="file"] {
            flex: 1;
        }

        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            display: none;
        }

        .photo-preview.show {
            display: block;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .event-photo {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
            overflow: hidden;
            position: relative;
        }

        .event-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-content {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .event-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .event-date {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 20px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .countdown-item {
            text-align: center;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .countdown-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .countdown-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .status {
            font-weight: 600;
            font-size: 0.9em;
        }

        .status.upcoming {
            color: #667eea;
        }

        .status.today {
            color: #ffa500;
        }

        .status.passed {
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Countdown Events</h1>
            <p>Track multiple events counting down to the moment</p>
        </header>

        <div class="add-event-section">
            <h2>Add New Event</h2>
            <form id="eventForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="eventName">Event Name</label>
                        <input type="text" id="eventName" placeholder="e.g., Summer Vacation" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Target Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group full photo-upload">
                        <label for="eventPhoto">Upload Photo (optional)</label>
                        <input type="file" id="eventPhoto" accept="image/*">
                        <img id="photoPreview" class="photo-preview" alt="Preview">
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Add Event</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>
            </form>
        </div>

        <div id="eventsContainer" class="events-grid">
            <div class="empty-state">
                <h2>No events yet!</h2>
                <p>Add your first event to get started 🚀</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize app
        const eventsContainer = document.getElementById('eventsContainer');
        const eventForm = document.getElementById('eventForm');
        const eventNameInput = document.getElementById('eventName');
        const eventDateInput = document.getElementById('eventDate');
        const eventPhotoInput = document.getElementById('eventPhoto');
        const photoPreview = document.getElementById('photoPreview');

        // Load events from localStorage
        let events = JSON.parse(localStorage.getItem('countdownEvents')) || [];

        // Photo preview
        eventPhotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    photoPreview.src = event.target.result;
                    photoPreview.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        });

        // Add event
        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newEvent = {
                id: Date.now(),
                name: eventNameInput.value,
                date: eventDateInput.value,
                photo: photoPreview.src || null,
                createdAt: new Date().toISOString()
            };

            events.push(newEvent);
            saveEvents();
            eventForm.reset();
            photoPreview.classList.remove('show');
            photoPreview.src = '';
            renderEvents();
        });

        // Delete event
        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveEvents();
            renderEvents();
        }

        // Save events to localStorage
        function saveEvents() {
            localStorage.setItem('countdownEvents', JSON.stringify(events));
        }

        // Calculate countdown
        function calculateCountdown(targetDate) {
            const target = new Date(targetDate).getTime();
            const now = new Date().getTime();
            const difference = target - now;

            if (difference < 0) {
                return {
                    days: 0,
                    hours: 0,
                    minutes: 0,
                    seconds: 0,
                    passed: true
                };
            }

            return {
                days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                minutes: Math.floor((difference / 1000 / 60) % 60),
                seconds: Math.floor((difference / 1000) % 60),
                passed: false
            };
        }

        // Calculate progress percentage
        function calculateProgress(targetDate) {
            const target = new Date(targetDate).getTime();
            const now = new Date().getTime();
            const created = new Date('2024-01-01').getTime(); // You can adjust this

            const totalDays = Math.floor((target - created) / (1000 * 60 * 60 * 24));
            const remainingDays = Math.floor((target - now) / (1000 * 60 * 60 * 24));

            if (totalDays <= 0) return 0;
            return Math.max(0, Math.min(100, ((totalDays - remainingDays) / totalDays) * 100));
        }

        // Get status
        function getStatus(targetDate, countdown) {
            if (countdown.passed) return 'passed';
            if (countdown.days === 0 && countdown.hours < 24) return 'today';
            return 'upcoming';
        }

        // Render events
        function renderEvents() {
            if (events.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>No events yet!</h2>
                        <p>Add your first event to get started 🚀</p>
                    </div>
                `;
                return;
            }

            eventsContainer.innerHTML = events.map(event => {
                const countdown = calculateCountdown(event.date);
                const progress = calculateProgress(event.date);
                const status = getStatus(event.date, countdown);

                return `
                    <div class="event-card">
                        <div class="event-photo">
                            ${event.photo ? `<img src="${event.photo}" alt="${event.name}">` : '📅'}
                        </div>
                        <div class="event-content">
                            <h3 class="event-title">${event.name}</h3>
                            <p class="event-date">${new Date(event.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>

                            <div class="countdown">
                                <div class="countdown-item">
                                    <div class="countdown-value">${countdown.days}</div>
                                    <div class="countdown-label">Days</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value">${countdown.hours}</div>
                                    <div class="countdown-label">Hours</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value">${countdown.minutes}</div>
                                    <div class="countdown-label">Minutes</div>
                                </div>
                                <div class="countdown-item">
                                    <div class="countdown-value">${countdown.seconds}</div>
                                    <div class="countdown-label">Seconds</div>
                                </div>
                            </div>

                            <div class="progress-section">
                                <div class="progress-label">
                                    <span>Progress</span>
                                    <span>${progress.toFixed(1)}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress}%"></div>
                                </div>
                            </div>

                            <div class="event-footer">
                                <span class="status ${status}">
                                    ${status === 'passed' ? '✓ Passed' : status === 'today' ? '⚡ Today!' : '🎯 Upcoming'}
                                </span>
                                <button class="btn-delete" onclick="deleteEvent(${event.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update countdowns every second
        setInterval(renderEvents, 1000);

        // Initial render
        renderEvents();
    </script>
</body>
</html>
